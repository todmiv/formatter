# ============================================================================
# КОНФИГУРАЦИЯ ФОРМАТИРОВАНИЯ ДОКУМЕНТОВ — ШАБЛОН ТИКСИ
# ============================================================================
# Источник: DOCX-шаблон "Шаблон записки со стилями_Эталон.docx"
# Извлечена автоматически через TemplateExtractor
# Описание: Конфигурация для оформления записок по образцу Эталон
# ============================================================================

version: '4.3'                                            # Версия конфигурации
name: 'Из шаблона: Шаблон записки со стилями_Эталон.docx'  # Название конфигурации
description: Конфигурация, извлечённая из DOCX-шаблона Шаблон записки со стилями_Эталон.docx

# ============================================================================
# СТИЛИ ОФОРМЛЕНИЯ
# ============================================================================
styles:
  # -------------------------------------------------------------------------
  # 01_Раздел — Заголовок раздела (уровень 1)
  # Используется для: РАЗДЕЛ 1, ВВЕДЕНИЕ и т.д.
  # -------------------------------------------------------------------------
  01_Раздел:
    enabled: true
    font:
name: Times New Roman          # Шрифт — Times New Roman
      bold: true
      size: 14                                            # Размер — 14 пт
      bold: true                                          # Жирный
    paragraph:
      space_after_pt: 6.0                                 # Интервал после заголовка 6 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 02_Глава — Заголовок главы (уровень 2)
  # Используется для: ГЛАВА 1, ГЛАВА 2 и т.д.
  # -------------------------------------------------------------------------
  02_Глава:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 0.0                                # Интервал перед главой 0 пт
      space_after_pt: 6.0                                 # Интервал после главы 6 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 031_Подпункт — Подпункт (уровень 4)
  # Используется для: подпунктов без нумерации
  # -------------------------------------------------------------------------
  031_Подпункт:
    enabled: true
    font:
      name: Times New Roman
      bold: true
      # дефолты: space_before=0, space_after=0, line_spacing=1.0, alignment=left, indent=0

  # -------------------------------------------------------------------------
  # 032_Заголовок — Заголовок подраздела
  # Используется для: текстовых заголовков внутри разделов
  # -------------------------------------------------------------------------
  032_Заголовок:
    enabled: true
    font:
      name: Times New Roman
      bold: true
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед заголовком 0 пт
      space_after_pt: 0.0                                 # Интервал после заголовка 0 пт

  # -------------------------------------------------------------------------
  # 03_Пункт — Пункт (уровень 3)
  # Используется для: 1.1, 1.2 и т.д.
  # -------------------------------------------------------------------------
  03_Пункт:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      bold: true
      size: 12                                            # Размер — 12 пт
    paragraph:
      space_before_pt: 6.0                                # Интервал перед пунктом 6 пт
      space_after_pt: 6.0                                 # Интервал после пункта 6 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 04_Основной текст — Обычный текст документа
  # Аналог стиля Normal для основного содержимого
  # -------------------------------------------------------------------------
  04_Основной текст:
    enabled: true
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 051_Название таблицы — Название таблицы над таблицей
  # Выравнивание по центру над таблицей
  # -------------------------------------------------------------------------
  051_Название таблицы:
    enabled: true
    paragraph:
      alignment: center                                   # Выравнивание по центру

  # -------------------------------------------------------------------------
  # 055_Примечание после таблицы/рисунка — Примечания к таблицам и рисункам
  # Шрифт 10 пт, без абзаца, интервал 1,15
  # -------------------------------------------------------------------------
  055_Примечание после таблицы/рисунка:
    enabled: true
    font:
      size: 10                                            # Размер шрифта 10 пт
    paragraph:
      first_line_indent_cm: 0.0                           # Без абзаца
      space_before_pt: 0.0                                # Интервал перед примечанием 0 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 056_ПослеТаблицы — Текст после таблицы (продолжение основного текста)
  # -------------------------------------------------------------------------
  056_ПослеТаблицы:
    enabled: true
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 6.0                                # Интервал перед текстом 6 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 05_Номер таблицы — Подпись таблицы (Таблица X.Y.Z)
  # Выравнивание по правому краю (п. 2.10.1)
  # -------------------------------------------------------------------------
  05_Номер таблицы:
    enabled: true
    font:
    paragraph:
      alignment: right                                    # Выравнивание по правому краю
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 06_Перечисление 1 уровень — Маркированный список
  # Используется для: списков с дефисом, тире
  # -------------------------------------------------------------------------
  06_Перечисление 1 уровень:
    enabled: true
    font:
    paragraph:
      first_line_indent_cm: 0.75                          # Отступ красной строки 0,75 см
      left_indent_cm: 0.0                                 # Левый отступ 0 см
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 08_Перечисление цифровое 1 уровень — Нумерованный список
  # Используется для: списков с цифрами (1, 2, 3...)
  # -------------------------------------------------------------------------
  08_Перечисление цифровое 1 уровень:
    enabled: true
    font:
    paragraph:
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 0911_Заголовок — Дополнительный заголовок
  # Используется для: подзаголовков разделов (например, "Миграционные процессы")
  # -------------------------------------------------------------------------
  0911_Заголовок:
    enabled: true
    font:
name: Times New Roman          # Шрифт — Times New Roman
      bold: true
      bold: true                                          # Жирный
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # 091216Текст — Текстовый стиль для основного содержимого
  # -------------------------------------------------------------------------
  091216Текст:
    enabled: true
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      line_spacing: 1.15                                  # Межстрочный интервал 1,15

  # -------------------------------------------------------------------------
  # Body Text 2 — Дополнительный текстовый стиль
  # -------------------------------------------------------------------------
  Body Text 2:
    enabled: true
    font:
    paragraph:
      line_spacing: 1.0                                   # Межстрочный интервал 1,0

  # -------------------------------------------------------------------------
  # Heading 2 — Стандартный заголовок уровня 2
  # Переопределяет стандартный стиль Heading 2
  # -------------------------------------------------------------------------
  Heading 2:
    enabled: true
    font:
      size: 13                                            # Размер — 13 пт
    paragraph:
      space_before_pt: 2.0                                # Интервал перед заголовком 2 пт

  # -------------------------------------------------------------------------
  # List Paragraph — Стиль для списков (перечислений)
  # Используется для: маркированных и нумерованных списков
  # -------------------------------------------------------------------------
  List Paragraph:
    enabled: true
    font:
      name: Calibri                                       # Шрифт — Calibri
      size: 11                                            # Размер — 11 пт
    paragraph:
      left_indent_cm: 1.27                                # Левый отступ 1,27 см
      space_after_pt: 10.0                                # Интервал после элемента списка 10 пт
      line_spacing: 1.15                                  # Межстрочный интервал 1,15
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # Normal — Стиль Normal (основной текст документа)
  # -------------------------------------------------------------------------
  Normal:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      bold: true
      size: 12                                            # Размер — 12 пт
    paragraph:
      line_spacing: 1.5                                   # Межстрочный интервал 1,5
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # Normal (Web) — Стиль Normal для веб-документов
  # -------------------------------------------------------------------------
  Normal (Web):
    enabled: true
    font:
      size: 9                                             # Размер — 9 пт
    paragraph:
      space_after_pt: 9.6                                 # Интервал после абзаца 9,6 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0

  # -------------------------------------------------------------------------
  # S_Обычный жирный — Жирный текст обычного стиля
  # Используется для: выделения важных фрагментов
  # -------------------------------------------------------------------------
  S_Обычный жирный:
    enabled: true
    font:
      size: 14                                            # Размер — 14 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # Текст доклада — Стиль для текста доклада/записки
  # -------------------------------------------------------------------------
  Текст доклада:
    enabled: true
    font:
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      left_indent_cm: 0.0                                 # Левый отступ 0 см
      space_after_pt: 0.0                                 # Интервал после абзаца 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0

# ============================================================================
# ПРАВИЛА АВТОМАТИЧЕСКОГО ОПРЕДЕЛЕНИЯ СТИЛЕЙ
# ============================================================================
detection_rules:
  # -------------------------------------------------------------------------
  # Заголовки разделов (уровень 1)
  # -------------------------------------------------------------------------
  01_Раздел:
    - ^ВВЕДЕНИЕ                                           # Паттерн: "ВВЕДЕНИЕ" в начале строки
    - ^РАЗДЕЛ\ 7\.\ ОСНОВНЫЕ\ Т                           # Паттерн: "РАЗДЕЛ 7. ОСНОВНЫЕ Т..."

  # -------------------------------------------------------------------------
  # Номера таблиц (подписи таблиц)
  # -------------------------------------------------------------------------
  05_Номер таблицы:
    - ^Т\s+\d+                                            # Паттерн: "Т 1", "Т 12" и т.д.
    - '^Т '                                               # Паттерн: "Т " в начале строки

  # -------------------------------------------------------------------------
  # Пункты (уровень 3) — нумерация 1.1, 1.2 и т.д.
  # -------------------------------------------------------------------------
  03_Пункт:
    - ^\d+\.\d+\s+                                        # Паттерн: "1.1 ", "2.3 " и т.д.

  # -------------------------------------------------------------------------
  # Заголовки глав (уровень 2)
  # -------------------------------------------------------------------------
  02_Глава:
    - ^ГЛАВА\s+\d+                                        # Паттерн: "ГЛАВА 1", "ГЛАВА 12" и т.д.
    - '^ГЛАВА '                                           # Паттерн: "ГЛАВА " в начале строки

  # -------------------------------------------------------------------------
  # Основной текст (пункты с буквенной нумерацией)
  # -------------------------------------------------------------------------
  04_Основной текст:
    - ^О\s+\d+                                            # Паттерн: "О 1", "О 12" и т.д.
    - '^О '                                               # Паттерн: "О " в начале строки

  # -------------------------------------------------------------------------
  # Названия таблиц (заголовки таблиц)
  # -------------------------------------------------------------------------
  051_Название таблицы:
    - ^О\s+\d+                                            # Паттерн: "О 1", "О 12" и т.д.
    - '^О '                                               # Паттерн: "О " в начале строки

  # -------------------------------------------------------------------------
  # Заголовки подразделов (текстовые)
  # -------------------------------------------------------------------------
  032_Заголовок:
    - ^Динамика\ численности                              # Паттерн: "Динамика численности..."
    - ^Естественное\ движени                              # Паттерн: "Естественное движени..."

  # -------------------------------------------------------------------------
  # Дополнительные заголовки (миграция)
  # -------------------------------------------------------------------------
  0911_Заголовок:
    - ^Миграционные\ процесс                              # Паттерн: "Миграционные процесс..."

  # -------------------------------------------------------------------------
  # Подпункты (уровень 4) — нумерация 1.1, 1.2 и т.д.
  # -------------------------------------------------------------------------
  031_Подпункт:
    - ^\d+\.\d+\s+                                        # Паттерн: "1.1 ", "2.3 " и т.д.

  # -------------------------------------------------------------------------
  # Перечисления (уровень 1) — списки с текстовыми пунктами
  # -------------------------------------------------------------------------
  06_Перечисление 1 уровень:
    - ^недостаточный\ уровен                              # Паттерн: "недостаточный уровен..."
    - ^необходимость\ обустр                              # Паттерн: "необходимость обустр..."

  # -------------------------------------------------------------------------
  # Примечания к таблицам/рисункам
  # -------------------------------------------------------------------------
  055_Примечание после таблицы/рисунка:
    - ^П\s+\d+                                            # Паттерн: "П 1", "П 12" и т.д.
    - '^П '                                               # Паттерн: "П " в начале строки

  # -------------------------------------------------------------------------
  # Цифровые перечисления (уровень 1)
  # -------------------------------------------------------------------------
  08_Перечисление цифровое 1 уровень:
    - ^Геотехнический\ монит                              # Паттерн: "Геотехнический монит..."
    - ^Защита\ грунтов\ от\ те                            # Паттерн: "Защита грунтов от те..."

# ============================================================================
# МАППИНГ ТИПОВ КОНТЕНТА → СТИЛИ
# ============================================================================
# Определяет, какие стили конфига используются для каждого типа контента.
# Конвертер MD→DOCX и аудитор используют этот маппинг для резолва стилей.
# ============================================================================
content_type_styles:
  heading_1: 01_Раздел                                    # Заголовки уровня 1 (РАЗДЕЛ)
  heading_2: 02_Глава                                     # Заголовки уровня 2 (ГЛАВА)
  heading_3: 03_Пункт                                     # Заголовки уровня 3 (1.1, 1.2)
  heading_4: 031_Подпункт                                 # Заголовки уровня 4 (подпункты)
  paragraph: 04_Основной текст                            # Обычный текст
  caption: 05_Номер таблицы                               # Подписи таблиц/рисунков
  table_name: 051_Название таблицы                        # Названия таблиц
  table_note: 055_Примечание после таблицы/рисунка       # Примечания к таблицам/рисункам
  table_grid: Table Grid                                  # Стиль таблиц (ячейки)
  list: 06_Перечисление 1 уровень                         # Элементы списков

# ============================================================================
# НАСТРОЙКИ СТРАНИЦЫ
# ============================================================================
page_setup:
  portrait:
    left_margin_cm: 2.5                                   # Левое поле 2,5 см
    right_margin_cm: 1.0                                  # Правое поле 1,0 см
    top_margin_cm: 2.0                                    # Верхнее поле 2,0 см
    bottom_margin_cm: 2.0                                 # Нижнее поле 2,0 см
  paper_size: A4                                          # Формат бумаги А4
  orientation_default: portrait                           # Ориентация по умолчанию книжная

# ============================================================================
# НАСТРОЙКИ КОЛОНТИТУЛОВ
# ============================================================================
headers_footers:
  header:
    enabled: true                                         # Верхний колонтитул включён
    position_from_edge_cm: 1.0                            # Положение от верхнего края 1,0 см
    alignment: right                                      # Номер страницы в верхнем правом углу
    first_page_empty: true                                # Первая страница без колонтитула
  footer:
    enabled: true                                         # Нижний колонтитул включён
    first_page_empty: true                                # Первая страница без колонтитула
    position_from_edge_cm: 1.0                            # Положение от нижнего края 1,0 см
    alignment: center                                     # Номер раздела/главы по центру
