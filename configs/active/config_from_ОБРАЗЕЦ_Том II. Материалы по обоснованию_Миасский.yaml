version: '4.2'
name: 'Из шаблона: ОБРАЗЕЦ_Том II. Материалы по обоснованию_Миасский.docx'
description: Конфигурация, извлечённая из DOCX-шаблона ОБРАЗЕЦ_Том II. Материалы по обоснованию_Миасский.docx
styles:
  021216Глава:
    enabled: true
    font:
      name: Times New Roman
      size: 12
      bold: true
    paragraph:
      space_before_pt: 6.0
      line_spacing: 1.15
  021216Подглава:
    enabled: true
    font:
      name: Times New Roman
      bold: true
      size: 12
    paragraph:
      space_before_pt: 6.0
      space_after_pt: 0.0
      line_spacing: 1.15
  021216Раздел:
    enabled: true
    font:
      name: Times New Roman
      size: 14
      bold: true
    paragraph:
      line_spacing: 1.15
  List Paragraph:
    enabled: true
    font:
      name: Calibri
      size: 11
    paragraph:
      left_indent_cm: 1.27
      space_after_pt: 10.0
      line_spacing: 1.15
  Normal:
    enabled: true
    font:
      name: Times New Roman
      bold: true
      # дефолты: space_before=0, space_after=0, line_spacing=1.0, alignment=left, indent=0
      size: 12
      # дефолты: space_before=0, space_after=0, line_spacing=1.0, alignment=left, indent=0
      # дефолты: space_before=0, space_after=0, line_spacing=1.0, alignment=left, indent=0
  Абзац:
    enabled: true
    paragraph:
      first_line_indent_cm: 1.0
      space_before_pt: 6.0
      space_after_pt: 3.0
  Пункт:
    enabled: true
    font:
      name: Times New Roman
      size: 12
      bold: true
      color: '000000'
      # дефолты: space_before=0, space_after=0, line_spacing=1.0, alignment=left, indent=0
    paragraph:
      left_indent_cm: 0.0
      space_before_pt: 6.0
      space_after_pt: 0.0
  Текст доклада:
    enabled: true
    font:
      size: 12
    paragraph:
      first_line_indent_cm: 1.25
      left_indent_cm: 0.0
      space_after_pt: 0.0
detection_rules:
  021216Глава:
  - ^ГЛАВА\ 3\.\ ДЕМОГРАФИЧЕ
  021216Подглава:
  - ^\d+\.\d+\s+
  Текст доклада:
  - ^Т\s+\d+
  - '^Т '
  Пункт:
  - ^\d+\.\d+\s+
page_setup:
  portrait:
    left_margin_cm: 2.5
    right_margin_cm: 1.0
    top_margin_cm: 2.0
    bottom_margin_cm: 2.0
  paper_size: A4
  orientation_default: portrait
headers_footers:
  header:
    enabled: true
    position_from_edge_cm: 1.0
  footer:
    enabled: true
    position_from_edge_cm: 1.0
    content: section_chapter_number
    alignment: center
    font:
      bold: true
