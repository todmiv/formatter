# ============================================================================
# КОНФИГУРАЦИЯ ФОРМАТИРОВАНИЯ ДОКУМЕНТОВ ПО НТД 01-2013
# ============================================================================
# Организация: не указана
# Департамент: Проектно-производственный
# Документ: Рабочая Инструкция НТД 01-2013 "Порядок оформления проектной 
#           градостроительной документации"
# Редакция: 4
# Год утверждения: 2018
# ============================================================================

version: "4.3"                                          # Версия конфигурации
name: "НТД 01-2013 Редакция 4 (с таблицами)"             # Название стандарта
description: "Конфигурация на основе Рабочей Инструкции по оформлению проектной градостроительной документации"
last_modified: "2024-01-15"                             # Дата последнего изменения

# ============================================================================
# СТИЛИ ОФОРМЛЕНИЯ
# ============================================================================
styles:
  # -------------------------------------------------------------------------
  # Обычный текст (стиль Normal)
  # -------------------------------------------------------------------------
  Normal:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - 12 пт для проектов местного значения
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
      color: "black"                                    # п. 2.7.2 - цвет шрифта чёрный
    paragraph:
      first_line_indent_cm: 1.25                        # п. 2.7.2 - отступ красной строки 1,25 см (5 печатных знаков)
      line_spacing: 1.15                                # п. 2.7.2 - междустрочный интервал 1,15 (при шрифте 12 пт)
      space_before_pt: 0                                # п. 2.7.2 - расстояние между абзацами 0 пт
      space_after_pt: 0                                 # п. 2.7.2 - расстояние между абзацами 0 пт
      alignment: "justify"                              # п. 2.7.2 - выравнивание текста по ширине

  # -------------------------------------------------------------------------
  # Заголовок 1 уровня - РАЗДЕЛ
  # -------------------------------------------------------------------------
  "Heading 1":
    enabled: true
    font:
      name: "Calibri Light"                             # Таблица 2.1 - основной шрифт Calibri Light
      east_asia: "Times New Roman"                      # Таблица 2.1 - кириллица Times New Roman
      size: 16                                          # Таблица 2.1 - шрифт 16 пт
      bold: true                                        # Таблица 2.1 - полужирный
      italic: false                                     # Таблица 2.1 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # Таблица 2.1 - отступ от левой границы 0,0 см
      line_spacing: 1.25                                # п. 2.7.2 - интервал 1,25 (при шрифте 16 пт)
      space_before_pt: 12                               # Таблица 2.1 - интервал перед 12 пт
      space_after_pt: 3                                 # Таблица 2.1 - интервал после 3 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание названий разделов по левому краю
      page_break_before: true                           # Таблица 2.1 - нумерация раздела начинается с новой страницы
      no_period_at_end: true                            # п. 2.7.2 - в конце заголовков точка не ставится

  # -------------------------------------------------------------------------
  # Заголовок 2 уровня - ГЛАВА
  # -------------------------------------------------------------------------
  "Heading 2":
    enabled: true
    font:
      name: "Calibri Light"                             # Таблица 2.1 - основной шрифт Calibri Light
      east_asia: "Times New Roman"                      # Таблица 2.1 - кириллица Times New Roman
      size: 14                                          # Таблица 2.1 - шрифт 14 пт
      bold: true                                        # Таблица 2.1 - полужирный
      italic: true                                      # Таблица 2.1 - курсив
    paragraph:
      first_line_indent_cm: 0                           # Таблица 2.1 - отступ от левой границы 0,0 см
      line_spacing: 1.25                                # п. 2.7.2 - интервал 1,25 (при шрифте 14 пт)
      space_before_pt: 12                               # Таблица 2.1 - интервал перед 12 пт
      space_after_pt: 3                                 # Таблица 2.1 - интервал после 3 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание названий глав по левому краю
      no_period_at_end: true                            # п. 2.7.2 - в конце заголовков точка не ставится

  # -------------------------------------------------------------------------
  # Заголовок 3 уровня - ПУНКТ (1.1, 1.2 и т.д.)
  # -------------------------------------------------------------------------
  "Heading 3":
    enabled: true
    font:
      name: "Cambria"                                   # Таблица 2.1 - шрифт Cambria
      east_asia: "Times New Roman"                      # Таблица 2.1 - кириллица Times New Roman
      size: 13                                          # Таблица 2.1 - шрифт 13 пт
      bold: true                                        # Таблица 2.1 - полужирный
      italic: false                                     # Таблица 2.1 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # Таблица 2.1 - отступ от левой границы 0,0 см
      line_spacing: 1.15                                # п. 2.7.2 - интервал 1,15
      space_before_pt: 12                               # Таблица 2.1 - интервал перед 12 пт
      space_after_pt: 3                                 # Таблица 2.1 - интервал после 3 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание названий пунктов по левому краю
      no_period_at_end: true                            # п. 2.7.2 - в конце заголовков точка не ставится

  # -------------------------------------------------------------------------
  # Заголовок 4 уровня - ПОДПУНКТ (без нумерации)
  # -------------------------------------------------------------------------
  "Heading 4":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # Таблица 2.1 - шрифт 12 пт (14 пт* для федеральных/региональных)
      bold: false                                       # Таблица 2.1 - без жирности
      italic: false                                     # Таблица 2.1 - без курсива
    paragraph:
      first_line_indent_cm: 1.25                        # Таблица 2.1 - отступ от левой границы 1,25 см
      line_spacing: 1.25                                # п. 2.7.2 - интервал 1,25
      space_before_pt: 0                                # Таблица 2.1 - интервал перед 0 пт
      space_after_pt: 0                                 # Таблица 2.1 - интервал после 0 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание названий подпунктов по левому краю
      no_period_at_end: true                            # п. 2.7.2 - в конце заголовков точка не ставится

  # -------------------------------------------------------------------------
  # Подписи (таблицы, рисунки)
  # -------------------------------------------------------------------------
  Caption:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.5.3 - без жирности
      italic: false                                     # п. 2.5.3 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.2, 2.11.2 - выравнивание по центру
      line_spacing: 1.0                                 # п. 2.7.2 - для подписей интервал 1,0
      space_before_pt: 6                                # п. 2.10.13, 2.11.4 - отступ перед 6 пт
      space_after_pt: 6                                 # п. 2.10.13, 2.11.4 - отступ после 6 пт
      alignment: "center"                               # п. 2.10.2, 2.11.2 - выравнивание по центру
      text_transform: "capitalize"                      # п. 2.10.2, 2.11.2 - с прописных букв
      no_period_at_end: true                            # п. 2.10.2, 2.11.2 - точка в конце не ставится

  # ============================================================================
  # ТАБЛИЦЫ - РАСШИРЕННЫЕ НАСТРОЙКИ
  # ============================================================================
  
  # -------------------------------------------------------------------------
  # Основная таблица
  # -------------------------------------------------------------------------
  "Table Grid":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - 12 пт (для таблиц допускается 10-12 пт)
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа в таблицах
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц междустрочный интервал 1,00
      space_before_pt: 0                                # п. 2.10.13 - отступ перед таблицей
      space_after_pt: 6                                 # п. 2.10.13 - текст после таблицы отделяется интервалом 6 пт
      alignment: "left"                                 # п. 2.10.7 - базовое выравнивание по левому краю
    table:
      auto_fit: "window"                                # п. 2.10.9 - автоподбор по ширине окна
      fixed_column_width: true                          # п. 2.10.9 - фиксированная ширина столбца
      row_height_cm: 0                                  # п. 2.10.8 - высота строки 0 см
      row_height_mode: "minimum"                        # п. 2.10.8 - режим высоты строки - минимум
      header_repeat_on_pages: true                      # п. 2.10.5 - повтор заголовков на следующих страницах
      border_style: "single"                            # п. 2.10.3 - стиль границ таблицы
      border_width_pt: 0.5                              # п. 2.10.3 - ширина границ

  # -------------------------------------------------------------------------
  # Шапка таблицы (отдельная таблица без нижней границы)
  # -------------------------------------------------------------------------
  "Table Header":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.3 - отступ перед шапкой
      space_after_pt: 0                                 # п. 2.10.3 - отступ после шапки
      alignment: "center"                               # п. 2.10.7 - заголовки граф по центру
    table:
      bottom_border: false                              # п. 2.10.3 - отключить нижнюю границу шапки
      header_row: true                                  # п. 2.10.3 - это строка заголовка
      column_numbering: true                            # п. 2.10.3 - нумерация граф в отдельной строке
      spacing_between_tables_multiplier: 0.06           # п. 2.10.3 - интервал между таблицами (шапкой и основной) - множитель 0,06

  # -------------------------------------------------------------------------
  # Заголовки граф таблицы
  # -------------------------------------------------------------------------
  "Table Column Header":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности (по РИ заголовки без жирности)
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.7 - отступ перед
      space_after_pt: 0                                 # п. 2.10.7 - отступ после
      alignment: "center"                               # п. 2.10.7 - заголовки граф выравниваются по центру
      text_transform: "capitalize"                      # п. 2.10.6 - заголовки граф пишутся с прописных букв
      no_period_at_end: true                            # п. 2.10.4 - точки в заголовках граф не ставятся
      no_abbreviations: true                            # п. 2.10.10 - сокращения в заголовках не допускаются

  # -------------------------------------------------------------------------
  # Подзаголовки граф таблицы
  # -------------------------------------------------------------------------
  "Table Column Subheader":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.7 - отступ перед
      space_after_pt: 0                                 # п. 2.10.7 - отступ после
      alignment: "center"                               # п. 2.10.7 - подзаголовки по центру
      text_transform: "lowercase"                       # п. 2.10.6 - подзаголовки со строчных, если поясняют заголовок
      text_transform_independent: "capitalize"          # п. 2.10.6 - с прописной, если имеют самостоятельное значение
      no_period_at_end: true                            # п. 2.10.4 - точки в подзаголовках не ставятся

  # -------------------------------------------------------------------------
  # Первый столбец таблицы
  # -------------------------------------------------------------------------
  "Table First Column":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.7 - отступ перед
      space_after_pt: 0                                 # п. 2.10.7 - отступ после
      alignment: "left"                                 # п. 2.10.7 - первый столбец по левому краю
      vertical_alignment: "center"                         # п. 2.10.7 - выравнивание сверху
      text_transform: "capitalize"                      # п. 2.10.11 - текст каждой позиции с прописной буквы
      no_period_at_end: true                            # п. 2.10.11 - точка и другие знаки препинания в конце не ставятся
    table:
      header_text: "№"                                  # п. 2.10.4 - в шапке пишется только "№" (без п/п)

  # -------------------------------------------------------------------------
  # Числовые данные в таблице
  # -------------------------------------------------------------------------
  "Table Numeric Cell":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.7 - отступ перед
      space_after_pt: 0                                 # п. 2.10.7 - отступ после
      alignment: "center"                               # п. 2.10.7 - цифры выравниваются по центру
      vertical_alignment: "center"                         # п. 2.10.7 - выравнивание сверху
    table:
      decimal_places_consistent: true                   # п. 2.10.12 - в одной графе одинаковое количество десятичных знаков

  # -------------------------------------------------------------------------
  # Текстовые данные в таблице (многострочные)
  # -------------------------------------------------------------------------
  "Table Text Cell":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.10.7 - без абзацного отступа
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.7 - отступ перед
      space_after_pt: 0                                 # п. 2.10.7 - отступ после
      alignment: "left"                                 # п. 2.10.7 - текстовая информация по левому краю
      vertical_alignment: "center"                         # п. 2.10.7 - выравнивание сверху

  # -------------------------------------------------------------------------
  # Примечание к таблице
  # -------------------------------------------------------------------------
  "Table Note":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.12.3 - тем же шрифтом, что и текст в таблице
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.12.2 - печатать без абзаца
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      space_before_pt: 0                                # п. 2.10.14, 2.12.4 - межстрочный интервал перед примечанием 0 пт
      space_after_pt: 6                                 # п. 2.10.13 - отступ после примечания
      alignment: "left"                                 # п. 2.12.2 - выравнивание по левому краю
      text_transform: "capitalize"                      # п. 2.12.2 - печатать с прописной буквы
      no_paragraph_indent: true                         # п. 2.12.2 - без абзаца

  # -------------------------------------------------------------------------
  # Стиль для списков (перечислений)
  # -------------------------------------------------------------------------
  "List Paragraph":
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.8.4 - текст перечислений с красной строки
      left_indent_level_1_cm: 0.75                      # п. 2.8.1 - 1-й уровень отступ 0,75 см
      left_indent_level_2_cm: 1.00                      # п. 2.8.1 - 2-й уровень отступ 1,00 см
      left_indent_level_3_cm: 1.25                      # п. 2.8.1 - 3-й и далее уровень отступ 1,25 см
      line_spacing: 1.15                                # п. 2.7.2 - междустрочный интервал 1,15
      space_before_pt: 0                                # п. 2.7.2 - расстояние между абзацами 0 пт
      space_after_pt: 0                                 # п. 2.7.2 - расстояние между абзацами 0 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание по левому краю

  # -------------------------------------------------------------------------
  # Примечания (общие)
  # -------------------------------------------------------------------------
  Note:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.12.2 - без абзаца
      line_spacing: 1.0                                 # п. 2.7.2 - интервал 1,0
      space_before_pt: 0                                # п. 2.12.4 - интервал перед примечанием 0 пт
      space_after_pt: 0                                 # п. 2.12.4 - интервал после примечания
      alignment: "left"                                 # п. 2.12.2 - выравнивание по левому краю

  # -------------------------------------------------------------------------
  # Приложения
  # -------------------------------------------------------------------------
  Appendix:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
      size: 12                                          # п. 2.7.2 - размер шрифта 12 пт
      bold: false                                       # п. 2.7.2 - без жирности
      italic: false                                     # п. 2.7.2 - без курсива
    paragraph:
      first_line_indent_cm: 0                           # п. 2.7.2 - без абзацного отступа
      line_spacing: 1.15                                # п. 2.7.2 - междустрочный интервал 1,15
      space_before_pt: 0                                # п. 2.7.2 - расстояние между абзацами 0 пт
      space_after_pt: 0                                 # п. 2.7.2 - расстояние между абзацами 0 пт
      alignment: "left"                                 # п. 2.7.2 - выравнивание по левому краю
      page_break_before: true                           # п. 2.13.2 - каждое приложение с новой страницы

  # -------------------------------------------------------------------------
  # Колонтитулы (верхний)
  # -------------------------------------------------------------------------
  Header:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.14.4 - шрифт Times New Roman
      size: 12                                          # п. 2.14.2, 2.14.4 - размер 12-14 пт
      bold: true                                        # п. 2.14.6 - жирный шрифт
      italic: false                                     # п. 2.14.6 - без курсива
      character_spacing: 1.5                            # п. 2.14.6 - с разрядкой
    paragraph:
      alignment: "right"                                # п. 2.14.2 - номер страницы в верхнем правом углу
    position:
      from_edge_cm: 1.0                                 # п. 2.14.3 - положение относительно верхнего края 1,0 см
    content:
      type: "page_number"                               # п. 2.14.1 - верхний колонтитул содержит нумерацию страниц
      arabic_numerals: true                             # п. 2.14.2 - арабскими цифрами
      no_page_word: true                                # п. 2.14.2 - без слов "страница", "стр."
      no_punctuation: true                              # п. 2.14.2 - без знаков препинания

  # -------------------------------------------------------------------------
  # Колонтитулы (нижний)
  # -------------------------------------------------------------------------
  Footer:
    enabled: true
    font:
      name: "Times New Roman"                           # п. 2.14.4 - шрифт Times New Roman
      size: 12                                          # п. 2.14.4 - размер 12-14 пт
      bold: true                                        # п. 2.14.6 - жирный шрифт
      italic: false                                     # п. 2.14.6 - без курсива
      character_spacing: 1.5                            # п. 2.14.6 - с разрядкой
    paragraph:
      alignment: "center"                               # п. 2.14.4 - по центру
      text_transform: "uppercase"                       # п. 2.14.4 - прописными буквами
    position:
      from_edge_cm: 1.0                                 # п. 2.14.5 - положение относительно нижнего края 1,0 см
    content:
      type: "section_chapter_number"                    # п. 2.14.4 - номер раздела и номер главы

# ============================================================================
# ПРАВИЛА АВТОМАТИЧЕСКОГО ОПРЕДЕЛЕНИЯ СТИЛЕЙ
# ============================================================================
detection_rules:
  "Heading 1":
    - "РАЗДЕЛ "                                         # Таблица 2.1 - распознавание заголовка РАЗДЕЛ
    - "^РАЗДЕЛ\\s+\\d+"                                 # Регулярное выражение для РАЗДЕЛ 1, РАЗДЕЛ 2 и т.д.
  
  "Heading 2":
    - "ГЛАВА "                                          # Таблица 2.1 - распознавание заголовка ГЛАВА
    - "^ГЛАВА\\s+\\d+"                                  # Регулярное выражение для ГЛАВА 1, ГЛАВА 2 и т.д.
  
  "Heading 3":
    - "^\\d+\\.\\d+\\s+"                                # п. 2.7.6 - нумерация пункта (1.1, 1.2 и т.д.)
  
  "Heading 4":
    - "^[А-Я][а-я]+\\s+"                                # Таблица 2.1 - подпункты без нумерации
  
  Caption:
    - "^Таблица\\s+\\d+"                                # п. 2.10.1 - распознавание подписи таблицы
    - "^Рисунок\\s+\\d+"                                # п. 2.11.1 - распознавание подписи рисунка
    - "^Примечание"                                     # п. 2.12.1 - распознавание примечания
    - "^Примечания:"                                    # п. 2.12.1 - множественное число примечаний
  
  "List Paragraph":
    - "^\\s*[–−-]\\s+"                                  # п. 2.8.3 - символьное начало перечисления (тире)
    - "^\\s*\\d+\\.[\\s)]"                              # п. 2.8.3 - цифровое начало перечисления (1, 2, 3)
    - "^\\s*[а-я]\\.[\\s)]"                             # п. 2.8.3 - буквенное начало перечисления (а, б, в)
  
  "Table Note":
    - "^Примечание\\s*[–:]"                             # п. 2.12.2 - примечание к таблице
    - "^\\*+"                                           # п. 2.12.5 - символы *, **, ***
    - "^\\d+\\s+"                                       # п. 2.12.5 - цифры 1, 2, 3, 4

# ============================================================================
# НАСТРОЙКИ СТРАНИЦЫ
# ============================================================================
page_setup:
  portrait:
    left_margin_cm: 3.0                                 # п. 2.7.2 - для книжной ориентации левое поле 30 мм
    right_margin_cm: 1.5                                # п. 2.7.2 - для книжной ориентации правое поле 15 мм
    top_margin_cm: 2.0                                  # п. 2.7.2 - для книжной ориентации верхнее поле 20 мм
    bottom_margin_cm: 2.0                               # п. 2.7.2 - для книжной ориентации нижнее поле 20 мм
  
  landscape:
    left_margin_cm: 2.0                                 # п. 2.7.2 - для альбомной ориентации левое поле 20 мм
    right_margin_cm: 2.0                                # п. 2.7.2 - для альбомной ориентации правое поле 20 мм
    top_margin_cm: 2.5                                  # п. 2.7.2 - для альбомной ориентации верхнее поле 25 мм
    bottom_margin_cm: 1.0                               # п. 2.7.2 - для альбомной ориентации нижнее поле 10 мм
  
  paper_size: "A4"                                      # п. 2.7.2 - формат бумаги А4
  orientation_default: "portrait"                       # п. 2.7.2 - ориентация по умолчанию книжная

# ============================================================================
# НАСТРОЙКИ КОЛОНТИТУЛОВ
# ============================================================================
headers_footers:
  header:
    enabled: true                                       # п. 2.14.1 - верхний колонтитул должен содержать нумерацию
    position_from_edge_cm: 1.0                          # п. 2.14.3 - положение относительно верхнего края 1,0 см
    content: "page_number"                              # п. 2.14.1 - нумерация страниц
    alignment: "right"                                  # п. 2.14.2 - в верхнем правом углу
    font_size_min: 12                                   # п. 2.14.2 - размер шрифта 12-14 пт
    font_size_max: 14                                   # п. 2.14.2 - размер шрифта 12-14 пт
    arabic_numerals: true                               # п. 2.14.2 - арабскими цифрами
    no_page_word: true                                  # п. 2.14.2 - без слов "страница", "стр."
    no_punctuation: true                                # п. 2.14.2 - без знаков препинания
    continuous_numbering: true                          # п. 2.14.2 - нумерация сквозная
  
  footer:
    enabled: true                                       # п. 2.14.4 - нижний колонтитул должен содержать номер раздела и главы
    position_from_edge_cm: 1.25                         # п. 2.14.5 - положение относительно нижнего края 1,25 см
    content: "section_chapter_number"                   # п. 2.14.4 - номер раздела и номер главы
    alignment: "center"                                 # п. 2.14.4 - по центру
    style: "uppercase_spaced"                           # п. 2.14.4 - прописными буквами с разрядкой
    bold: true                                          # п. 2.14.6 - жирный шрифт
    character_spacing: 1.5                              # п. 2.14.6 - с разрядкой
    section_break_independent: true                     # п. 2.14.4 - для разных разделов разные колонтитулы

# ============================================================================
# ПРАВИЛА ФОРМАТИРОВАНИЯ
# ============================================================================
formatting_rules:
  # -------------------------------------------------------------------------
  # Запрещённые действия
  # -------------------------------------------------------------------------
  prohibited:
    - word_hyphenation: false                           # п. 2.7.3 - запрещается переносить и разбивать слова
    - split_dates: false                                # п. 2.7.3 - запрещается разнесение даты по разным строкам
    - split_initials: false                             # п. 2.7.3 - запрещается разнесение инициалов и фамилии
    - split_numbers_units: false                        # п. 2.7.3 - запрещается разнесение числовых значений и единиц измерения
  
  # -------------------------------------------------------------------------
  # Математические знаки (только с числовыми значениями)
  # -------------------------------------------------------------------------
  math_symbols_require_numbers:
    - ">"                                               # п. 2.7.4 - без числовых значений не допускается
    - "<"                                               # п. 2.7.4 - без числовых значений не допускается
    - "="                                               # п. 2.7.4 - без числовых значений не допускается
    - "№"                                               # п. 2.7.4 - без числовых значений не допускается
    - "%"                                               # п. 2.7.4 - без числовых значений не допускается
  
  # -------------------------------------------------------------------------
  # Единицы измерения
  # -------------------------------------------------------------------------
  units:
    consistent_throughout: true                         # п. 2.7.2 - обозначения единиц измерений единообразно
    after_last_value: true                              # п. 2.7.5 - обозначение после последнего числового значения
    same_parameter_constant: true                       # п. 2.7.5 - единица измерения одного параметра постоянна
  
  # -------------------------------------------------------------------------
  # Заголовки
  # -------------------------------------------------------------------------
  headings:
    no_period_at_end: true                              # п. 2.7.2 - в конце заголовков точка не ставится
    no_bold: true                                       # Таблица 2.1 - без жирности
    left_aligned: true                                  # п. 2.7.2 - выравнивание по левому краю
  
  # ============================================================================
  # ТАБЛИЦЫ - ПРАВИЛА ФОРМАТИРОВАНИЯ
  # ============================================================================
  tables:
    # -------------------------------------------------------------------------
    # Нумерация таблиц
    # -------------------------------------------------------------------------
    numbering:
      enabled: true                                     # п. 2.10.1 - таблицы нумеруются
      format: "section.number"                          # п. 2.10.1 - нумерация в пределах раздела сквозная (например, 1.5)
      chapter_format: "section.chapter.number"          # п. 2.10.1 - если разделы подразделяются на главы (например, 2.3.1)
      no_number_sign: true                              # п. 2.10.1 - без знака "№"
      single_table_no_number: true                      # п. 2.10.1 - если одна таблица, не нумеруется
      appendix_restart: true                            # п. 2.10.15 - в приложениях нумерация с начала
      word_capitalized: true                            # п. 2.10.1 - слово "Таблица" с заглавной буквы
      position: "top_right"                             # п. 2.10.1 - у правой границы текстового поля
    
    # -------------------------------------------------------------------------
    # Название таблицы
    # -------------------------------------------------------------------------
    title:
      position: "above"                                 # п. 2.10.2 - название пишется над таблицей
      alignment: "center"                               # п. 2.10.2 - выравнивание по центру
      text_transform: "capitalize"                      # п. 2.10.2 - с прописных букв
      no_period_at_end: true                            # п. 2.10.2 - точка в конце не ставится
      no_abbreviations: true                            # п. 2.10.10 - сокращения не допускаются
    
    # -------------------------------------------------------------------------
    # Шапка таблицы
    # -------------------------------------------------------------------------
    header:
      separate_table: true                              # п. 2.10.3 - оформляется в виде отдельной (первой) таблицы
      bottom_border_disabled: true                      # п. 2.10.3 - отключить нижнюю границу
      column_numbering_row: true                        # п. 2.10.3 - строка с нумерацией граф
      spacing_multiplier: 0.06                          # п. 2.10.3 - интервал между таблицами - множитель 0,06
      repeat_on_pages: true                             # п. 2.10.5 - повтор заголовков на следующих страницах
      numbering_only_on_subsequent: true                # п. 2.10.5 - на последующих страницах только номера граф
    
    # -------------------------------------------------------------------------
    # Заголовки граф
    # -------------------------------------------------------------------------
    column_headers:
      text_transform: "capitalize"                      # п. 2.10.6 - с прописных букв
      no_period_at_end: true                            # п. 2.10.4 - точка не ставится
      alignment: "center"                               # п. 2.10.7 - по центру
      no_abbreviations: true                            # п. 2.10.10 - сокращения не допускаются
    
    # -------------------------------------------------------------------------
    # Подзаголовки граф
    # -------------------------------------------------------------------------
    column_subheaders:
      text_transform: "lowercase"                       # п. 2.10.6 - со строчных если поясняют заголовок
      text_transform_independent: "capitalize"          # п. 2.10.6 - с прописной если самостоятельное значение
      no_period_at_end: true                            # п. 2.10.4 - точка не ставится
      alignment: "center"                               # п. 2.10.7 - по центру
    
    # -------------------------------------------------------------------------
    # Первый столбец
    # -------------------------------------------------------------------------
    first_column:
      header_text: "№"                                  # п. 2.10.4 - только "№" (без п/п)
      text_transform: "capitalize"                      # п. 2.10.11 - с прописной буквы
      no_period_at_end: true                            # п. 2.10.11 - точка не ставится
      alignment: "left"                                 # п. 2.10.7 - по левому краю
      vertical_alignment: "center"                         # п. 2.10.7 - сверху
    
    # -------------------------------------------------------------------------
    # Выравнивание содержимого
    # -------------------------------------------------------------------------
    alignment:
      headers: "center_center"                             # п. 2.10.7 - заголовки по центру сверху
      numeric_values: "center_center"                      # п. 2.10.7 - цифры по центру сверху
      text_values: "left_center"                           # п. 2.10.7 - текст по левому краю сверху
      first_column: "left_center"                          # п. 2.10.7 - первый столбец по левому краю сверху
    
    # -------------------------------------------------------------------------
    # Размеры и свойства
    # -------------------------------------------------------------------------
    properties:
      row_height_cm: 0                                  # п. 2.10.8 - высота строки 0 см
      row_height_mode: "minimum"                        # п. 2.10.8 - режим - минимум
      auto_fit_window: true                             # п. 2.10.9 - автоподбор по ширине окна
      fixed_column_width: true                          # п. 2.10.9 - фиксированная ширина столбца
    
    # -------------------------------------------------------------------------
    # Шрифт в таблицах
    # -------------------------------------------------------------------------
    font:
      size_min: 10                                      # п. 2.7.2 - допускается уменьшение от 10 пт
      size_max: 12                                      # п. 2.7.2 - до 12 пт
      line_spacing: 1.0                                 # п. 2.7.2 - для таблиц интервал 1,0
      name: "Times New Roman"                           # п. 2.7.2 - шрифт Times New Roman
    
    # -------------------------------------------------------------------------
    # Интервалы
    # -------------------------------------------------------------------------
    spacing:
      after_table_pt: 6                                 # п. 2.10.13 - текст после таблицы 6 пт
      before_note_pt: 0                                 # п. 2.10.14, 2.12.4 - перед примечанием 0 пт
      between_table_note: 0                             # п. 2.10.14 - между таблицей и примечанием 0 пт
    
    # -------------------------------------------------------------------------
    # Числовые значения
    # -------------------------------------------------------------------------
    numeric:
      consistent_decimal_places: true                   # п. 2.10.12 - одинаковое количество десятичных знаков в графе
    
    # -------------------------------------------------------------------------
    # Ссылки
    # -------------------------------------------------------------------------
    references:
      required_in_text: true                            # п. 2.10.16 - на все таблицы должны быть ссылки в тексте
    
    # -------------------------------------------------------------------------
    # Приложения
    # -------------------------------------------------------------------------
    appendix:
      same_criteria: true                               # п. 2.10.15 - такие же критерии оформления
      numbering_restart: true                           # п. 2.10.15 - нумерация с начала приложения

  # -------------------------------------------------------------------------
  # Рисунки
  # -------------------------------------------------------------------------
  figures:
    numbering:
      enabled: true                                     # п. 2.11.1 - рисунки нумеруются
      format: "section.number"                          # п. 2.11.1 - нумерация в пределах раздела сквозная
      chapter_format: "section.chapter.number"          # п. 2.11.1 - если разделы на главы (например, 2.3.1)
      no_number_sign: true                              # п. 2.11.1 - без знака "№"
      single_figure_no_number: true                     # п. 2.11.1 - если один рисунок, не нумеруется
      word_capitalized: true                            # п. 2.11.1 - слово "Рисунок" с заглавной буквы
      position: "top_right"                             # п. 2.11.1 - у правой границы текстового поля
    title:
      position: "above"                                 # п. 2.11.2 - название пишется над рисунком
      alignment: "center"                               # п. 2.11.2 - выравнивание по центру
      text_transform: "capitalize"                      # п. 2.11.2 - с прописных букв
      no_period_at_end: true                            # п. 2.11.2 - точка в конце не ставится
    spacing:
      after_figure_pt: 6                                # п. 2.11.4 - текст после рисунка 6 пт
      before_note_pt: 0                                 # п. 2.11.3 - перед примечанием 0 пт
    references:
      required_in_text: true                            # п. 2.11.5 - на все рисунки должны быть ссылки

  # -------------------------------------------------------------------------
  # Примечания
  # -------------------------------------------------------------------------
  notes:
    position: "after_content"                           # п. 2.12.2 - после текста, рисунка или таблицы
    capitalized: true                                   # п. 2.12.2 - с прописной буквы
    no_indent: true                                     # п. 2.12.2 - без абзаца
    interval_before_pt: 0                               # п. 2.12.4 - интервал перед 0 пт
    markers: ["*", "**", "***", "1", "2", "3", "4"]      # п. 2.12.5 - символы для пометок
    table_font_same: true                               # п. 2.12.3 - тем же шрифтом что и текст в таблице

  # -------------------------------------------------------------------------
  # Нумерация страниц
  # -------------------------------------------------------------------------
  numbering:
    continuous_throughout: true                         # п. 2.14.2 - нумерация сквозная
    no_page_word: true                                  # п. 2.14.2 - без слов "страница", "стр."
    arabic_numerals: true                               # п. 2.14.2 - арабскими цифрами
    no_punctuation: true                                # п. 2.14.2 - без знаков препинания
    position: "top_right"                               # п. 2.14.2 - в верхнем правом углу
    font_size_min: 12                                   # п. 2.14.2 - размер 12-14 пт
    font_size_max: 14                                   # п. 2.14.2 - размер 12-14 пт
    appendix_separate: true                             # п. 2.14.2 - страницы приложений нумеруются отдельно

# ============================================================================
# ПРОЕКТЫ ФЕДЕРАЛЬНОГО И РЕГИОНАЛЬНОГО ЗНАЧЕНИЯ
# ============================================================================
federal_regional_projects:
  font_size_base: 14                                    # п. 2.7.2 - для проектов федерального/регионального значения 14 пт
  font_size_heading_1: 16                               # Таблица 2.1 - шрифт 16 пт для РАЗДЕЛ
  font_size_heading_2: 14                               # Таблица 2.1 - шрифт 14 пт для ГЛАВА
  font_size_heading_3: 14                               # Таблица 2.1 - шрифт 14 пт для пункт
  font_size_heading_4: 14                               # Таблица 2.1 - шрифт 14 пт для подпункт
  font_size_table: 12                                   # п. 2.7.2 - для таблиц допускается 10-12 пт
  line_spacing: 1.25                                    # п. 2.7.2 - интервал 1,25 при шрифте 14 пт

# ============================================================================
# ПРОВЕРКА СООТВЕТСТВИЯ (ВАЛИДАЦИЯ)
# ============================================================================
validation:
  tables:
    check_references: true                              # п. 2.10.16 - проверять наличие ссылок в тексте
    check_numbering: true                               # п. 2.10.1 - проверять нумерацию
    check_title_format: true                            # п. 2.10.2 - проверять формат названия
    check_header_format: true                           # п. 2.10.3, 2.10.4 - проверять формат заголовков граф
    check_decimal_places: true                          # п. 2.10.12 - проверять количество знаков после запятой
    check_abbreviations: true                           # п. 2.10.10 - проверять отсутствие сокращений
    check_periods_in_headers: true                      # п. 2.10.4 - проверять отсутствие точек в заголовках
    check_first_column_header: true                     # п. 2.10.4 - проверять "№" вместо "п/п"
    check_row_height: true                              # п. 2.10.8 - проверять высоту строки 0 см
    check_spacing_after: true                           # п. 2.10.13 - проверять интервал после таблицы 6 пт
    check_spacing_before_note: true                     # п. 2.10.14 - проверять интервал перед примечанием 0 пт
  
  figures:
    check_references: true                              # п. 2.11.5 - проверять наличие ссылок в тексте
    check_numbering: true                               # п. 2.11.1 - проверять нумерацию
    check_title_format: true                            # п. 2.11.2 - проверять формат названия
  
  pages:
    check_margins: true                                 # п. 2.7.2 - проверять поля страницы
    check_page_numbering: true                          # п. 2.14.2 - проверять нумерацию страниц
    check_headers_footers: true                         # п. 2.14.1, 2.14.4 - проверять колонтитулы
  
  text:
    check_font: true                                    # п. 2.7.2 - проверять шрифт Times New Roman
    check_line_spacing: true                            # п. 2.7.2 - проверять междустрочный интервал
    check_no_hyphenation: true                          # п. 2.7.3 - проверять отсутствие переносов
    check_no_split_dates: true                          # п. 2.7.3 - проверять отсутствие разнесения дат
    check_units_consistent: true                        # п. 2.7.2, 2.7.5 - проверять единообразие единиц измерения
