# ============================================================================
# КОНФИГУРАЦИЯ ФОРМАТИРОВАНИЯ ДОКУМЕНТОВ — НТД 01-2013 (АВГУСТ 2026)
# ============================================================================
# Источник: НТД 01-2013 «Порядок оформления проектной градостроительной
#           документации» (редакция август 2026)
# Описание: Универсальная конфигурация оформления текстовой части
#           (пояснительной записки) по НТД 01-2013 (август 2026).
# Универсальные имена стилей (01_Раздел, 02_Глава, ...) не привязаны
# к конкретному образцу; для записок по образцу Эталон используйте
# config_Эталон.yaml (имена стилей соответствуют Эталон.docx).
# Ключевые требования новой РИ, отражённые здесь:
#   - междустрочный интервал — 1,00 (множитель) для всего текста (п. 2.7.2);
#   - размер шрифта — 12 пт для всего текста, для таблиц до 10 пт (п. 2.7.2);
#   - поля книжной ориентации: 20/10/20/20 мм; альбомной: 20/10/20/20 мм (п. 2.7.2);
#   - отступ красной строки — 1,25 см (п. 2.7.2);
#   - расстояние между абзацами одного стиля — 0 пт (п. 2.7.2);
#   - выравнивание текста — по ширине, заголовков — по левому краю (п. 2.7.2);
#   - подпись таблицы/рисунка — по центру текстового поля (п. 2.10.1, 2.11.1);
#   - нумерация таблиц/рисунков/формул — сквозная (п. 2.10.2, 2.11.3, 2.9.2);
#   - шапка таблицы — жирным шрифтом, по центру (п. 2.10.4);
#   - выравнивание в таблицах — сверху по левому краю (п. 2.10.8);
#   - текст после таблицы/рисунка — интервал 0 пт (п. 2.10.14, 2.11.4);
#   - перечисления — отступ 0,75 см (п. 2.8.1);
#   - верхний колонтитул: номер страницы 12 пт, справа (п. 2.14.2, 2.14.3);
#   - нижний колонтитул ничего не содержит (п. 2.14.4).
# ============================================================================

version: '5.0'                                            # Версия конфигурации
name: 'НТД 01-2013 (август 2026)'
description: Универсальная конфигурация оформления текстовой части по НТД 01-2013 (август 2026)

# ============================================================================
# СТИЛИ ОФОРМЛЕНИЯ
# ============================================================================
# Если у стиля не задана секция paragraph:, используются дефолты Word:
#   space_before_pt: 0    — интервал перед абзацем (пункты)
#   space_after_pt: 0     — интервал после абзаца (пункты)
#   line_spacing: 1.0     — межстрочный интервал (одинарный)
#   alignment: left       — выравнивание по левому краю
#   first_line_indent: 0  — отступ красной строки (нет)
#   left_indent: 0        — левый отступ (нет)
#   page_break_before: false — разрыв страницы перед стилем (нет)
# ============================================================================
styles:
  # -------------------------------------------------------------------------
  # 01_Раздел — Заголовок раздела (уровень 1)
  # Используется для: РАЗДЕЛ 1, ВВЕДЕНИЕ и т.д.
  # -------------------------------------------------------------------------
  01_Раздел:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 0.0                                # Интервал перед заголовком 0 пт
      space_after_pt: 0.0                                 # Интервал после заголовка 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # Выравнивание по левому краю
      page_break_before: true                             # Каждый раздел с новой страницы

  # -------------------------------------------------------------------------
  # 02_Глава — Заголовок главы (уровень 2)
  # Используется для: ГЛАВА 1, ГЛАВА 2 и т.д.
  # -------------------------------------------------------------------------
  02_Глава:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 6.0                                # Интервал перед главой 6 пт
      space_after_pt: 0.0                                 # Интервал после главы 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 03_Пункт — Пункт (уровень 3)
  # Используется для: 1.1, 1.2 и т.д.
  # -------------------------------------------------------------------------
  03_Пункт:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 6.0                                # Интервал перед пунктом 6 пт
      space_after_pt: 0.0                                 # Интервал после пункта 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 031_Подпункт — Подпункт (уровень 4)
  # Используется для: 1.1.1, 1.1.2 и т.д.
  # -------------------------------------------------------------------------
  031_Подпункт:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 6.0                                # Интервал перед подпунктом 6 пт
      space_after_pt: 0.0                                 # Интервал после подпункта 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # Выравнивание по левому краю

  # -------------------------------------------------------------------------
  # 032_Заголовок — Заголовок подраздела (текстовый, с красной строки)
  # -------------------------------------------------------------------------
  032_Заголовок:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед заголовком 0 пт
      space_after_pt: 0.0                                 # Интервал после заголовка 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 04_Основной текст — Обычный текст документа
  # Аналог стиля Normal для основного содержимого (п. 2.7.2)
  # -------------------------------------------------------------------------
  04_Основной текст:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед абзацем 0 пт
      space_after_pt: 0.0                                 # Интервал после абзаца 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 05_Номер таблицы — Подпись таблицы/рисунка (Таблица N, Рисунок N)
  # По центру текстового поля (п. 2.10.1, 2.11.1)
  # -------------------------------------------------------------------------
  05_Номер таблицы:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      space_before_pt: 6.0                                # Интервал перед подписью 6 пт
      space_after_pt: 0.0                                 # Интервал после подписи 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: center                                   # По центру (п. 2.10.1)

  # -------------------------------------------------------------------------
  # 051_Название таблицы — Название таблицы (вторая строка подписи)
  # По центру над таблицей (п. 2.10.3)
  # -------------------------------------------------------------------------
  051_Название таблицы:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      space_before_pt: 0.0                                # Интервал перед названием 0 пт
      space_after_pt: 0.0                                 # Интервал после названия 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: center                                   # По центру (п. 2.10.3)

  # -------------------------------------------------------------------------
  # 053_Выравнивание в таблице — Текст в ячейках таблиц
  # Шрифт до 10 пт, сверху по левому краю (п. 2.7.2, 2.10.8)
  # -------------------------------------------------------------------------
  053_Выравнивание в таблице:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 10                                            # Размер 10 пт (допустимо для таблиц)
    paragraph:
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # По левому краю (п. 2.10.8)

  # -------------------------------------------------------------------------
  # 055_Примечание после таблицы/рисунка — Примечания к таблицам и рисункам
  # Шрифт как в таблице — 10 пт, без абзаца, интервал перед 0 пт (п. 2.12.3, 2.12.4)
  # -------------------------------------------------------------------------
  055_Примечание после таблицы/рисунка:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 10                                            # Размер шрифта 10 пт
    paragraph:
      first_line_indent_cm: 0.0                           # Без абзаца (п. 2.12.2)
      space_before_pt: 0.0                                # Интервал перед примечанием 0 пт
      space_after_pt: 0.0                                 # Интервал после примечания 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # По левому краю

  # -------------------------------------------------------------------------
  # 056_ПослеТаблицы — Текст после таблицы (продолжение основного текста)
  # Интервал перед текстом 0 пт (п. 2.10.14)
  # -------------------------------------------------------------------------
  056_ПослеТаблицы:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед текстом 0 пт (п. 2.10.14)
      space_after_pt: 0.0                                 # Интервал после абзаца 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 06_Перечисление 1 уровень — Маркированный список (тире)
  # Отступ 0,75 см (п. 2.8.1)
  # -------------------------------------------------------------------------
  06_Перечисление 1 уровень:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 0.75                          # Отступ 0,75 см (п. 2.8.1)
      left_indent_cm: 0.0                                 # Левый отступ 0 см
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 08_Перечисление цифровое 1 уровень — Нумерованный список
  # Используется для: списков с цифрами (1, 2, 3...) (п. 2.8.3)
  # -------------------------------------------------------------------------
  08_Перечисление цифровое 1 уровень:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 0911_Заголовок — Дополнительный текстовый заголовок
  # -------------------------------------------------------------------------
  0911_Заголовок:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # 091216Текст — Текстовый стиль для основного содержимого
  # -------------------------------------------------------------------------
  091216Текст:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # Table Grid — Стиль ячеек таблиц
  # Шрифт 10 пт, сверху по левому краю (п. 2.7.2, 2.10.8)
  # -------------------------------------------------------------------------
  Table Grid:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 10                                            # Размер — 10 пт
    paragraph:
      first_line_indent_cm: 0                             # Без отступа
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      space_before_pt: 0                                  # Интервал перед 0 пт
      space_after_pt: 0                                   # Интервал после 0 пт
      alignment: left                                     # По левому краю (п. 2.10.8)

  # -------------------------------------------------------------------------
  # Heading 2 — Стандартный заголовок уровня 2
  # -------------------------------------------------------------------------
  Heading 2:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
      bold: true                                          # Жирный
    paragraph:
      space_before_pt: 6.0                                # Интервал перед заголовком 6 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: left                                     # По левому краю

  # -------------------------------------------------------------------------
  # List Paragraph — Стиль для списков (перечислений)
  # -------------------------------------------------------------------------
  List Paragraph:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      left_indent_cm: 0.75                                # Отступ 0,75 см (п. 2.8.1)
      space_before_pt: 0.0                                # Интервал перед 0 пт
      space_after_pt: 0.0                                 # Интервал после 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # Normal — Стиль Normal (основной текст документа, п. 2.7.2)
  # -------------------------------------------------------------------------
  Normal:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 1.25                          # Отступ красной строки 1,25 см
      space_before_pt: 0.0                                # Интервал перед абзацем 0 пт
      space_after_pt: 0.0                                 # Интервал после абзаца 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

  # -------------------------------------------------------------------------
  # Note — Примечание (общее, п. 2.12)
  # -------------------------------------------------------------------------
  Note:
    enabled: true
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер — 12 пт
    paragraph:
      first_line_indent_cm: 0.0                           # Без абзаца (п. 2.12.2)
      space_before_pt: 0.0                                # Интервал перед примечанием 0 пт
      space_after_pt: 0.0                                 # Интервал после примечания 0 пт
      line_spacing: 1.0                                   # Межстрочный интервал 1,0
      alignment: justify                                  # Выравнивание по ширине

# ============================================================================
# ПРАВИЛА АВТОМАТИЧЕСКОГО ОПРЕДЕЛЕНИЯ СТИЛЕЙ
# ============================================================================
# Используются аудитом для определения целевого стиля абзаца по тексту.
# Порядок важен: более специфичные правила (подпункты) идут раньше общих.
# ============================================================================
detection_rules:
  01_Раздел:
    - ^РАЗДЕЛ\s+\d+                                       # "РАЗДЕЛ 1. ..."
    - ^ВВЕДЕНИЕ\s*$                                       # "ВВЕДЕНИЕ"
    - ^ЗАКЛЮЧЕНИЕ\s*$                                     # "ЗАКЛЮЧЕНИЕ"

  02_Глава:
    - ^ГЛАВА\s+\d+                                        # "ГЛАВА 1. ..."

  031_Подпункт:
    - ^\d+\.\d+\.\d+\s+                                  # "1.1.1 ..."

  03_Пункт:
    - ^\d+\.\d+\s+[А-ЯЁA-Z]                              # "2.1 Название ..."

  05_Номер таблицы:
    - ^Таблица\s+\d+                                      # "Таблица 1 ..."
    - ^Рисунок\s+\d+                                      # "Рисунок 1 ..."

  055_Примечание после таблицы/рисунка:
    - ^Примечание                                         # "Примечание ..."

# ============================================================================
# МАППИНГ ТИПОВ КОНТЕНТА → СТИЛИ
# ============================================================================
# Определяет, какие стили конфига используются для каждого типа контента.
# Конвертер MD→DOCX и аудитор используют этот маппинг для резолва стилей.
# ============================================================================
content_type_styles:
  heading_1: 01_Раздел                                    # Заголовки уровня 1 (РАЗДЕЛ)
  heading_2: 02_Глава                                     # Заголовки уровня 2 (ГЛАВА)
  heading_3: 03_Пункт                                     # Заголовки уровня 3 (1.1, 1.2)
  heading_4: 031_Подпункт                                 # Заголовки уровня 4 (подпункты)
  paragraph: 04_Основной текст                            # Обычный текст
  caption: 05_Номер таблицы                               # Подписи таблиц/рисунков
  table_name: 051_Название таблицы                        # Названия таблиц
  table_note: 055_Примечание после таблицы/рисунка       # Примечания к таблицам/рисункам
  table_grid: Table Grid                                  # Стиль таблиц (ячейки)
  list: 06_Перечисление 1 уровень                         # Элементы списков
  note: Note                                              # Примечания

# ============================================================================
# НАСТРОЙКИ СТРАНИЦЫ (п. 2.7.2)
# ============================================================================
# Книжная ориентация: 20 мм — левое, 10 мм — правое, 20 мм — верхнее, 20 мм — нижнее
# Альбомная ориентация: 20 мм — верхнее, 10 мм — нижнее, 20 мм — левое, 20 мм — правое
# ============================================================================
page_setup:
  portrait:
    left_margin_cm: 2.0                                   # Левое поле 2,0 см
    right_margin_cm: 1.0                                  # Правое поле 1,0 см
    top_margin_cm: 2.0                                    # Верхнее поле 2,0 см
    bottom_margin_cm: 2.0                                 # Нижнее поле 2,0 см
  landscape:
    left_margin_cm: 2.0                                   # Левое поле 2,0 см
    right_margin_cm: 2.0                                  # Правое поле 2,0 см
    top_margin_cm: 2.0                                    # Верхнее поле 2,0 см
    bottom_margin_cm: 1.0                                 # Нижнее поле 1,0 см
  paper_size: A4                                          # Формат бумаги А4
  orientation_default: portrait                           # Ориентация по умолчанию книжная

# ============================================================================
# НАСТРОЙКИ КОЛОНТИТУЛОВ (п. 2.14)
# ============================================================================
# Верхний колонтитул: нумерация страниц 12 пт арабскими цифрами в правом
# верхнем углу, положение от верхнего края 1,0 см (п. 2.14.2, 2.14.3).
# Нижний колонтитул ничего не содержит (п. 2.14.4), положение 1,0 см (п. 2.14.5).
# ============================================================================
headers_footers:
  header:
    enabled: true                                         # Верхний колонтитул включён
    position_from_edge_cm: 1.0                            # Положение от верхнего края 1,0 см
    content: page_number                                 # Номер страницы
    alignment: right                                      # В верхнем правом углу (п. 2.14.2)
    first_page_empty: true                                # Первая страница без колонтитула
    font:
      name: Times New Roman                               # Шрифт — Times New Roman
      size: 12                                            # Размер 12 пт (п. 2.14.2)
      bold: false                                         # Без жирности
  footer:
    enabled: false                                        # Нижний колонтитул пуст (п. 2.14.4)
    position_from_edge_cm: 1.0                            # Положение от нижнего края 1,0 см
    content: section_chapter_number
    alignment: center
    first_page_empty: true                                # Первая страница без колонтитула

# ============================================================================
# ПРАВИЛА ФОРМАТИРОВАНИЯ (аудит и валидация контента)
# ============================================================================
formatting_rules:
  headings:
    no_period_at_end: true                                # В конце заголовков точка не ставится (п. 2.7.2)
    left_aligned: true                                    # Заголовки по левому краю (п. 2.7.2)
  math_symbols_require_numbers: ['>', '<', '=', '№', '%']  # п. 2.7.4
  tables:
    numbering:
      enabled: true
      format: continuous                                 # Сквозная нумерация (п. 2.10.2)
      no_number_sign: true                               # Без знака «№»
      word_capitalized: true                             # «Таблица» с заглавной буквы (п. 2.10.1)
      position: top_center                               # Над таблицей по центру (п. 2.10.1)
    title:
      position: above                                    # Название над таблицей
      alignment: center                                  # По центру (п. 2.10.3)
      no_period_at_end: true                             # В конце названия точка не ставится
    header:
      separate_table: false                              # Единая таблица (п. 2.10.4)
      column_numbering_row: false                        # Без строки нумерации граф
      repeat_on_pages: true                              # Повтор заголовков
    column_headers:
      alignment: center                                  # Шапка по центру (п. 2.10.4)
      no_period_at_end: true                             # Точки в заголовках граф не ставятся (п. 2.10.6)
    alignment:
      headers: center_top                                # Шапка: по центру
      numeric_values: left_top                           # Числа: сверху по левому краю (п. 2.10.8)
      text_values: left_top                              # Текст: сверху по левому краю (п. 2.10.8)
      first_column: left_top                             # Первый столбец: сверху по левому краю (п. 2.10.8)
    properties:
      row_height_cm: 0                                   # Высота строк 0 см (п. 2.10.9)
      row_height_mode: minimum                           # Режим — минимум (п. 2.10.9)
      auto_fit_window: true                              # Автоподбор по ширине окна (п. 2.10.10)
      fixed_column_width: true                           # Фиксированная ширина столбца (п. 2.10.10)
    font:
      size_min: 10                                       # Для таблиц до 10 пт (п. 2.7.2)
      size_max: 12
      line_spacing: 1.0
      name: Times New Roman
    spacing:
      after_table_pt: 0                                  # Текст после таблицы — 0 пт (п. 2.10.14)
      before_note_pt: 0                                  # Между таблицей и примечанием 0 пт (п. 2.10.15)
  figures:
    numbering:
      enabled: true
      format: continuous                                 # Сквозная нумерация (п. 2.11.3)
      no_number_sign: true
      word_capitalized: true                             # «Рисунок» с заглавной буквы (п. 2.11.1)
      position: top_center                               # Над рисунком по центру (п. 2.11.1)
    title:
      position: above
      alignment: center                                  # Название по центру (п. 2.11.2)
      no_period_at_end: true
    spacing:
      after_figure_pt: 0                                 # Текст после рисунка — 0 пт (п. 2.11.4)
      before_note_pt: 0                                  # Между рисунком и примечанием 0 пт (п. 2.11.3)
  notes:
    position: after_content                              # После материала (п. 2.12.2)
    capitalized: true                                    # С прописной буквы (п. 2.12.2)
    no_indent: true                                      # Без абзаца (п. 2.12.2)
    interval_before_pt: 0                                # Интервал перед примечанием 0 пт (п. 2.12.4)
    table_font_same: true                                # Как текст в таблице (п. 2.12.3)
  numbering:
    continuous_throughout: true                          # Сквозная нумерация страниц (п. 2.14.2)
    no_page_word: true                                   # Без слов «страница», «стр.»
    arabic_numerals: true                                # Арабские цифры
    no_punctuation: true                                 # Без знаков препинания
    position: top_right                                  # В верхнем правом углу (п. 2.14.2)
    font_size_min: 12                                    # Шрифт 12 пт (п. 2.14.2)
    font_size_max: 12
    appendix_separate: true                              # Приложения нумеруются отдельно
