# Основной конфигурационный файл с использованием includes
# Демонстрация модульной системы конфигурации

version: "4.2"
name: "НТД 01-2013 Редакция 4 (с includes)"
description: "Конфигурация с использованием модульных подключений"

# Подключение базовых стилей и настроек страницы
includes:
  - base_styles.yaml
  - page_setup_gost.yaml

# Локальные переопределения (перезаписывают включённые значения)
styles:
  "Heading 4":
    enabled: true
    font:
      name: "Times New Roman"
      size: 12
      bold: false
      italic: false
    paragraph:
      first_line_indent_cm: 1.25
      line_spacing: 1.25
      space_before_pt: 0
      space_after_pt: 0
      alignment: "left"
      no_period_at_end: true

  Caption:
    enabled: true
    font:
      name: "Times New Roman"
      size: 12
      bold: false
      italic: false
    paragraph:
      first_line_indent_cm: 0
      line_spacing: 1.0
      space_before_pt: 6
      space_after_pt: 6
      alignment: "center"
      text_transform: "capitalize"
      no_period_at_end: true

detection_rules:
  "Heading 4":
    - "^[А-Я][а-я]+\\s+"

  Caption:
    - "^Таблица\\s+\\d+"
    - "^Рисунок\\s+\\d+"
    - "^Примечание"
