# Базовые стили для всех конфигураций
# Этот файл подключается через includes

styles:
  Normal:
    enabled: true
    font:
      name: "Times New Roman"
      size: 12
      bold: false
      italic: false
      color: "black"
    paragraph:
      first_line_indent_cm: 1.25
      line_spacing: 1.0
      space_before_pt: 0
      space_after_pt: 0
      alignment: "justify"

  "Heading 1":
    enabled: true
    font:
      name: "Calibri Light"
      east_asia: "Times New Roman"
      size: 16
      bold: true
      italic: false
    paragraph:
      first_line_indent_cm: 0
      line_spacing: 1.0
      space_before_pt: 12
      space_after_pt: 0
      alignment: "left"
      page_break_before: true
      no_period_at_end: true

  "Heading 2":
    enabled: true
    font:
      name: "Calibri Light"
      east_asia: "Times New Roman"
      size: 14
      bold: true
      italic: true
    paragraph:
      first_line_indent_cm: 0
      line_spacing: 1.0
      space_before_pt: 6
      space_after_pt: 0
      alignment: "left"
      no_period_at_end: true

  "Heading 3":
    enabled: true
    font:
      name: "Cambria"
      east_asia: "Times New Roman"
      size: 13
      bold: true
      italic: false
    paragraph:
      first_line_indent_cm: 0
      line_spacing: 1.0
      space_before_pt: 12
      space_after_pt: 0
      alignment: "left"
      no_period_at_end: true

detection_rules:
  "Heading 1":
    - "^РАЗДЕЛ\\s+\\d+"
    - "^РАЗДЕЛ "

  "Heading 2":
    - "^ГЛАВА\\s+\\d+"
    - "^ГЛАВА "

  "Heading 3":
    - "^\\d+\\.\\d+\\s+"
